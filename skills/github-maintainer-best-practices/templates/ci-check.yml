name: Documentation Sync Check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'lib/**'
      - '**.js'
      - '**.py'
      - '**.ts'
  push:
    branches: [main, master]

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check documentation sync
        run: |
          # 检查 README 是否更新
          if git diff --name-only HEAD~1 | grep -E 'src/|lib/' | grep -q .; then
            echo "⚠️ 代码文件有变更，请检查 README 是否已同步更新"
            
            if ! git diff --name-only HEAD~1 | grep -q 'README'; then
              echo "❌ 错误: 代码变更但未更新 README.md"
              exit 1
            fi
          fi
          
          echo "✅ 文档同步检查通过"

      - name: Check CHANGELOG
        run: |
          if git diff --name-only HEAD~1 | grep -q 'CHANGELOG'; then
            echo "✅ CHANGELOG 已更新"
          else
            echo "⚠️ 提醒: 建议更新 CHANGELOG.md"
          fi

      - name: Validate version bump
        run: |
          # 检查版本号是否正确更新
          if [ -f package.json ]; then
            VERSION=$(cat package.json | grep '"version"' | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
            echo "当前版本: $VERSION"
          fi
